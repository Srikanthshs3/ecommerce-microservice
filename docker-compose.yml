# =====================================================================================================
#  docker-compose.yml  (run from the repo root, next to the .env file)
#
#  Secrets: compose reads ./.env and substitutes ${VARS} below. NOTE: .env is only used for substitution,
#  it is NOT passed to the containers automatically - that is why every secret a service needs is listed
#  explicitly in its `environment:` block.
#  Required: JWT_SECRET, APP_CRYPTO_KEY.  For payments: RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET.  (see .env.example)
#  Only plain ${VAR} / ${VAR:-default} are used below (no ${VAR:?...}) so older Compose versions work too.
#
#  Build order:  mvn clean package -DskipTests        (the Dockerfiles copy target/*.jar from the host)
#                docker compose up -d --build
# =====================================================================================================

x-spring-env: &spring-env
  SPRING_CLOUD_CONFIG_URI: http://config-server:8888
  SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
  SPRING_PROFILES_ACTIVE: docker
  eureka.client.serviceUrl.defaultZone: http://eureka-server:8761/eureka/
  EUREKA_HOST: eureka-server
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: http://tempo:9411/api/v2/spans
  LOKI_URL: http://loki:3100/loki/api/v1/push
  # Same value in the gateway and every service (empty = unsigned identity headers, a warning is logged).
  GATEWAY_IDENTITY_SIGNING_SECRET: ${GATEWAY_IDENTITY_SIGNING_SECRET:-}

# Environment building blocks. Each one extends the previous with a single merge key
# (a merge key given a LIST of anchors is valid for Docker but IntelliJ reports "Single value is expected").
x-env-kafka: &env-kafka
  <<: *spring-env
  SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:29092
  SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081

x-env-kafka-redis: &env-kafka-redis
  <<: *env-kafka
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"

x-env-mysql: &env-mysql                       # kafka + MySQL (no Redis)
  <<: *env-kafka
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Admin@123}
  SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-none}   # Flyway owns the schema. Set DDL_AUTO=validate to check entities vs tables
  SPRING_FLYWAY_ENABLED: "true"

x-env-mysql-redis: &env-mysql-redis           # kafka + Redis + MySQL
  <<: *env-kafka-redis
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Admin@123}
  SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-none}   # Flyway owns the schema. Set DDL_AUTO=validate to check entities vs tables
  SPRING_FLYWAY_ENABLED: "true"

x-env-postgres-redis: &env-postgres-redis     # kafka + Redis + Postgres
  <<: *env-kafka-redis
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Admin@123}
  SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-none}   # Flyway owns the schema. Set DDL_AUTO=validate to check entities vs tables
  SPRING_FLYWAY_ENABLED: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect

# Settings every Spring Boot service shares
x-service: &service
  restart: on-failure          # a service that starts before its dependency is ready just retries
  pull_policy: build           # always use the image built from THIS folder (never a stale one from Docker Hub)
  networks:
    - ecom-net

x-after-platform: &after-platform
  eureka-server:
    condition: service_started
  config-server:
    condition: service_healthy
  broker:
    condition: service_started
  schema-registry:
    condition: service_started

services:

  # ------------------------------------------------------------------------------------ data stores
  redis:
    image: redis:7.0
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ecom-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Admin@123}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-scripts/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - ecom-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-scripts/mongo:/docker-entrypoint-initdb.d:ro
    networks:
      - ecom-net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Admin@123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - ecom-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------------------------ Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    networks:
      - ecom-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  broker:
    image: confluentinc/cp-kafka:7.5.0
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    networks:
      ecom-net:
        aliases:
          - broker
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - broker
    ports:
      - "8081:8081"
    networks:
      ecom-net:
        aliases:
          - schema-registry
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_DEBUG: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - broker
      - schema-registry
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=ecom-platform
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=broker:29092
      - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://schema-registry:8081
    networks:
      - ecom-net

  # ------------------------------------------------------------------------------------ platform
  eureka-server:
    <<: *service
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    image: praskanth/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  config-server:
    <<: *service
    build:
      context: ./config-server
      dockerfile: Dockerfile
    image: praskanth/config-server:latest
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=https://github.com/Srikanthshs3/cloud-config-server.git
      - SPRING_PROFILES_ACTIVE=docker,git
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    depends_on:
      - eureka-server
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  api-gateway:
    <<: *service
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    image: praskanth/api-gateway:latest
    container_name: api-gateway
    ports:
      - "2323:2323"
    environment:
      <<: *spring-env
      # must be IDENTICAL to user-service's value, otherwise every token is rejected
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-ecommerce-user-service}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ------------------------------------------------------------------------------------ business services
  user-service:
    <<: *service
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    image: praskanth/user-service:latest
    environment:
      <<: *env-mysql-redis
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_service?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-ecommerce-user-service}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Admin}
      # AES-256 key (base64 of 32 bytes) for the encrypted DB columns. This is the value the crash was asking for.
      APP_CRYPTO_KEY: ${APP_CRYPTO_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Google reCAPTCHA secret key (server side). Empty = the CAPTCHA step is skipped; the 6-failure block still applies.
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
    depends_on:
      <<: *after-platform
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  cart-service:
    <<: *service
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    container_name: cart-service
    image: praskanth/cart-service:latest
    environment:
      <<: *env-mysql-redis
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    depends_on:
      <<: *after-platform
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  inventory-service:
    <<: *service
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    image: praskanth/inventory-service:latest
    environment:
      <<: *env-mysql-redis
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inventory_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_KAFKA_CONSUMER_GROUP_ID: inventory-service-group
    depends_on:
      <<: *after-platform
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  shipping-service:
    <<: *service
    build:
      context: ./shipping-service
      dockerfile: Dockerfile
    container_name: shipping-service
    image: praskanth/shipping-service:latest
    environment:
      <<: *env-mysql-redis
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shipping_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_KAFKA_CONSUMER_GROUP_ID: shipping-service-group
      # Signs the customer's delivery code (never stored). Set your own long random value in .env.
      SHIPPING_OTP_SECRET: ${SHIPPING_OTP_SECRET:-dev-only-delivery-otp-secret-change-me}
      SHIPPING_AGENT_MAX_ACTIVE: ${SHIPPING_AGENT_MAX_ACTIVE:-10}
      SHIPPING_DELIVERY_MAX_ATTEMPTS: ${SHIPPING_DELIVERY_MAX_ATTEMPTS:-2}
    depends_on:
      <<: *after-platform
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    <<: *service
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    image: praskanth/notification-service:latest
    environment:
      <<: *env-kafka
      SPRING_KAFKA_CONSUMER_GROUP_ID: notification-group
      # Base address of the web app: the password-reset email links to  <this>/reset-password?token=...
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      SPRING_MAIL_USERNAME: srikanthp0720@gmail.com
      # SPRING_MAIL_PASSWORD normally comes from the config-server repo; to override it, add it to .env and uncomment:
      # SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
    depends_on:
      <<: *after-platform

  category-service:
    <<: *service
    build:
      context: ./category-service
      dockerfile: Dockerfile
    container_name: category-service
    image: praskanth/category-service:latest
    environment:
      <<: *env-kafka-redis
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/category-service
    depends_on:
      <<: *after-platform
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  product-service:
    <<: *service
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    image: praskanth/product-service:latest
    environment:
      <<: *env-kafka-redis
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/product-service
      PRODUCT_IMAGES_STORAGE_DIR: /app/uploads/products
    volumes:
      - product_images:/app/uploads/products
    depends_on:
      <<: *after-platform
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    <<: *service
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    image: praskanth/order-service:latest
    environment:
      <<: *env-postgres-redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_KAFKA_CONSUMER_GROUP_ID: order-service-group
      SPRING_CLOUD_OPENFEIGN_CIRCUITBREAKER_ENABLED: "false"
    depends_on:
      <<: *after-platform
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service:
    <<: *service
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    image: praskanth/payment-service:latest
    environment:
      <<: *env-postgres-redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_KAFKA_CONSUMER_GROUP_ID: payment-service-group
      PAYMENT_SANDBOX_ONLY: "true"
      # Gateway keys come ONLY from your local .env (never written in this file). Plain ${VAR} on purpose: old Docker
      # Compose releases mishandle the ${VAR:?message} form. Empty = that gateway is hidden on the payment page.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      <<: *after-platform
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  review-service:
    <<: *service
    build:
      context: ./review-service
      dockerfile: Dockerfile
    container_name: review-service
    image: praskanth/review-service:latest
    environment:
      <<: *env-mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/review_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      REVIEW_IMAGE_DIR: /app/uploads/reviews
      REVIEW_REQUIRE_PURCHASE: "false"
    volumes:
      - review_images:/app/uploads/reviews   # uploaded review pictures survive container re-creation
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy

  coupon-service:
    <<: *service
    build:
      context: ./coupon-service
      dockerfile: Dockerfile
    container_name: coupon-service
    image: praskanth/coupon-service:latest
    environment:
      <<: *env-mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coupon_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    depends_on:
      eureka-server:
        condition: service_started
      config-server:
        condition: service_healthy
      mysql:
        condition: service_healthy

  # ------------------------------------------------------------------------------------ observability
  prometheus:
    image: prom/prometheus:v2.46.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
    depends_on:
      - user-service
    networks:
      - ecom-net

  loki:
    image: grafana/loki:main
    command: [ '-config.file=/etc/loki/local-config.yaml' ]
    ports:
      - '3100:3100'
    networks:
      - ecom-net

  tempo:
    image: grafana/tempo:2.2.2
    command: [ '-config.file=/etc/tempo.yaml' ]
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro
      - ./docker/tempo/tempo-data:/tmp/tempo
    ports:
      - '3101:3100' # Tempo
      - '9411:9411' # zipkin
    networks:
      - ecom-net

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=password
      - GF_USERS_ALLOW_SIGN_UP=true
    depends_on:
      - prometheus
    networks:
      - ecom-net

volumes:
  redis_data:
  kafka-data:
  mysql-data:
  postgres_data:
  mongodb_data:
  prometheus-data:
  loki-data:
  grafana-data:
  review_images:
  product_images:

networks:
  ecom-net:
    driver: bridge
