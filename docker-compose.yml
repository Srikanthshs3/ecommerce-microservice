      - SPRING_KAFKA_CONSUMER_GROUP_ID=payment-service-group
      - PAYMENT_GATEWAY_DEFAULT=RAZORPAY
      - PAYMENT_SANDBOX_ENABLED="true"
      - RAZORPAY_KEY_ID=rzp_test_TXdoEQlWcywtKm
      - RAZORPAY_KEY_SECRET=i34ckC4w2huIWrCxzB9HqbDh
    networks:
