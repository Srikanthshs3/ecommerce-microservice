      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/category-service
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/
