server:
  port: 2313

spring:
  application:
    name: PRODUCT-SERVICE
  cloud:
    config:
      enabled: true
  config:
    # repo-root .env (JWT_SECRET, APP_CRYPTO_KEY ...). Optional: absent in Docker, where compose injects real env vars.
    import: optional:file:./.env[.properties],optional:file:../.env[.properties],optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}

  data:
    mongodb:
      host: localhost
      port: 27017
      database: product-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

user:
  api:
    url: http://USER-SERVICE