server:
  port: 2311
  shutdown: graceful

spring:
  flyway:
    enabled: true
    # Flyway owns the schema. V1__baseline.sql builds an empty database; a database that already
    # has tables (created earlier by Hibernate) is baselined at 1 and only V2+ is applied.
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    connect-retries: 10
  application:
    name: USER-SERVICE
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    open-in-view: false          # no lazy loading from the web layer; mappers run inside @Transactional services
  cloud:
    config:
      enabled: true
  config:
    # repo-root .env (JWT_SECRET, APP_CRYPTO_KEY ...). Optional: absent in Docker, where compose injects real env vars.
    import: optional:file:./.env[.properties],optional:file:../.env[.properties],optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}

# --- secrets: inject from the environment / secret manager, never commit values ---
jwt:
  secret: ${JWT_SECRET:}                  # >= 32 bytes. (legacy key `secreteJwtString` is still honoured)
  access-expiration-minutes: 15
  refresh-expiration-days: 7
  issuer: ${JWT_ISSUER:ecommerce-user-service}   # must equal the gateway's jwt.issuer

app:
  crypto:
    key: ${APP_CRYPTO_KEY}                # base64 of 32 random bytes:  openssl rand -base64 32
  cookie:
    secure: ${COOKIE_SECURE:true}         # false only for local http development

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
