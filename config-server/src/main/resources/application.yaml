server:
  port: 8888

spring:
  application:
    name: CONFIG-SERVER
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: ${SPRING_CLOUD_CONFIG_SERVER_GIT_URI:https://github.com/Srikanthshs3/cloud-config-server.git}
          default-label: main
          clone-on-start: true
          force-pull: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, refresh
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO