server:
  port: 2323

spring:
  application:
    name: API-GATEWAY
  cloud:
    config:
      enabled: true
  config:
    # Use environment variable for Docker, fallback to localhost for IDE
    # repo-root .env (JWT_SECRET, APP_CRYPTO_KEY ...). Optional: absent in Docker, where compose injects real env vars.
    import: optional:file:./.env[.properties],optional:file:../.env[.properties],optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}

jwt:
  secret: ${JWT_SECRET:}          # SAME value as user-service; >= 32 bytes; no default on purpose (fail closed)
  issuer: ${JWT_ISSUER:ecommerce-user-service}

# --- Identity propagation (X-User-Id / X-User-Email / X-User-Roles) -------------------------------------------
# Optional but recommended in production: when set, the gateway also sends X-Gateway-Timestamp and
# X-Gateway-Signature (HMAC-SHA256) and every downstream service rejects headers whose signature does not verify.
# MUST be the same value in the gateway and in every downstream service, and at least 32 characters.
gateway:
  identity:
    signing-secret: ${GATEWAY_IDENTITY_SIGNING_SECRET:}
