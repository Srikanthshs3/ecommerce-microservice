server:
  port: 2318

spring:
  application:
    name: PAYMENT-SERVICE
  cloud:
    config:
      enabled: true
  config:
    # repo-root .env (JWT_SECRET, APP_CRYPTO_KEY, RAZORPAY_KEY_ID ...). Optional: absent in Docker, where
    # docker-compose.yml injects the same names as real environment variables.
    import: optional:file:./.env[.properties],optional:file:../.env[.properties],optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  flyway:
    enabled: true
    connect-retries: 10
    # Same reasoning as order-service/inventory-service: adopt the existing DB (created by
    # ddl-auto: update) at "version 1" without requiring a V1 migration, then apply V2+.
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

# IMPORTANT: now that Flyway owns the schema, spring.jpa.hibernate.ddl-auto must be changed
# from "update" to "validate" in the EXTERNAL config-repo's payment-service.yml (config-server
# values override whatever is set locally here, so it can't be flipped in this file).

payment:
  currency: INR
  # Learning project: only TEST keys (rzp_test_ / sk_test_) are accepted. Set PAYMENT_SANDBOX_ONLY=false to allow live keys (never do that here).
  sandbox-only: ${PAYMENT_SANDBOX_ONLY:true}
  cod:
    enabled: true
    max-amount: 50000

# Empty defaults: the service starts without keys; a gateway without keys is simply hidden from the payment page.
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
